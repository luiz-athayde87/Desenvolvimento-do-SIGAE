{% extends "base.html" %}
{% block page_actions %}<button class="button primary" id="new-patient" type="button"><i data-lucide="user-plus"></i>Novo paciente</button>{% endblock %}
{% block content %}
<section class="metric-grid compact-grid">
  <article class="mini-metric"><span>Total cadastrado</span><strong id="patients-total">—</strong><i data-lucide="contact-round"></i></article>
  <article class="mini-metric"><span>Aguardando</span><strong id="patients-waiting">—</strong><i data-lucide="clock-3"></i></article>
  <article class="mini-metric"><span>Em atendimento</span><strong id="patients-active">—</strong><i data-lucide="heart-pulse"></i></article>
  <article class="mini-metric"><span>Concluídos</span><strong id="patients-completed">—</strong><i data-lucide="badge-check"></i></article>
</section>
<section class="panel data-panel">
  <div class="toolbar">
    <label class="filter-search"><i data-lucide="search"></i><input id="patient-search" type="search" placeholder="Buscar por nome ou ID"></label>
    <select id="patient-status" aria-label="Filtrar por situação"><option value="">Todas as situações</option><option>Aguardando</option><option>Em atendimento</option><option>Concluido</option><option>Cancelado</option></select>
    <select id="patient-priority" aria-label="Filtrar por prioridade"><option value="">Todas as prioridades</option><option value="1">P1 — Emergência</option><option value="2">P2 — Muito urgente</option><option value="3">P3 — Urgente</option><option value="4">P4 — Pouco urgente</option><option value="5">P5 — Não urgente</option></select>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Prioridade</th><th>Chegada</th><th>Tempo total</th><th>Situação</th><th class="align-right">Ações</th></tr></thead><tbody id="patients-table"></tbody></table></div>
  <div class="pagination"><button class="button small ghost" id="patients-prev">Anterior</button><span id="patients-page">Página 1</span><button class="button small ghost" id="patients-next">Próxima</button></div>
</section>
<dialog class="modal" id="patient-modal"><form class="modal-card" id="patient-form"><div class="modal-header"><div class="modal-icon"><i data-lucide="user-plus"></i></div><div><h2>Novo paciente</h2><p>Registre a entrada com o horário real atual.</p></div><button class="icon-button modal-close" type="button" data-close-modal="patient-modal"><i data-lucide="x"></i></button></div><div class="form-grid"><label class="field wide"><span>Nome completo</span><input id="patient-name" maxlength="120" required></label><label class="field wide"><span>Queixa principal</span><textarea id="patient-complaint" maxlength="500" rows="3" placeholder="Descreva brevemente o motivo do atendimento"></textarea></label><label class="field"><span>Prioridade inicial</span><select id="patient-priority-input" required><option value="1">P1 — Emergência</option><option value="2">P2 — Muito urgente</option><option value="3" selected>P3 — Urgente</option><option value="4">P4 — Pouco urgente</option><option value="5">P5 — Não urgente</option></select></label></div><div class="modal-actions"><button class="button ghost" type="button" data-close-modal="patient-modal">Cancelar</button><button class="button primary" type="submit">Cadastrar paciente</button></div></form></dialog>
{% endblock %}
