{% extends "base.html" %}
{% block page_actions %}<button class="button primary" id="new-doctor" type="button"><i data-lucide="user-plus"></i>Adicionar médico</button>{% endblock %}
{% block content %}
<section class="metric-grid compact-grid"><article class="mini-metric"><span>Equipe total</span><strong id="doctors-total">—</strong><i data-lucide="stethoscope"></i></article><article class="mini-metric"><span>Disponíveis</span><strong id="doctors-available">—</strong><i data-lucide="user-round-check"></i></article><article class="mini-metric"><span>Em atendimento</span><strong id="doctors-active">—</strong><i data-lucide="activity"></i></article><article class="mini-metric"><span>Indisponíveis</span><strong id="doctors-offline">—</strong><i data-lucide="user-round-x"></i></article></section>
<section class="panel"><div class="toolbar"><label class="filter-search"><i data-lucide="search"></i><input id="doctor-search" type="search" placeholder="Buscar médico, CRM ou ID"></label><select id="doctor-status"><option value="">Todas as situações</option><option value="Disponivel">Disponíveis</option><option value="Em atendimento">Em atendimento</option><option value="Indisponivel">Indisponíveis</option></select></div><div class="doctor-grid" id="doctor-grid"></div></section>
<dialog class="modal" id="doctor-modal"><form class="modal-card" id="doctor-form"><div class="modal-header"><div class="modal-icon"><i data-lucide="stethoscope"></i></div><div><h2>Novo médico</h2><p>Adicione um profissional ao corpo clínico.</p></div><button class="icon-button modal-close" type="button" data-close-modal="doctor-modal"><i data-lucide="x"></i></button></div><div class="form-grid"><label class="field wide"><span>Nome completo</span><input id="doctor-name" required></label><label class="field"><span>CRM</span><input id="doctor-crm" placeholder="CRM-UF 000000" required></label><label class="field"><span>Especialidade</span><input id="doctor-specialty" value="Clínica Geral" maxlength="80" required></label></div><div class="modal-actions"><button class="button ghost" type="button" data-close-modal="doctor-modal">Cancelar</button><button class="button primary" type="submit">Adicionar à equipe</button></div></form></dialog>
{% endblock %}
