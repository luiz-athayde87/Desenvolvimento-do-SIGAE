openapi: 3.1.0
info:
  title: SIGAE API
  version: 1.0.0
  description: API do simulador de gerenciamento de atendimentos de emergência.
servers:
  - url: http://127.0.0.1:5000/api/v1
    description: Ambiente local
tags:
  - name: System
  - name: Patients
  - name: Doctors
  - name: Attendances
  - name: Auth
paths:
  /health:
    get:
      tags: [System]
      summary: Verifica a aplicação e o banco
      responses:
        "200":
          description: Serviço saudável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /state:
    get:
      tags: [System]
      summary: Retorna o estado completo do plantão
      responses:
        "200":
          description: Estado atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /search:
    get:
      tags: [System]
      summary: Pesquisa pacientes e médicos
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/ValidationError"
  /patients:
    post:
      tags: [Patients]
      summary: Cadastra um paciente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Paciente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /patients/{identifier}:
    get:
      tags: [Patients]
      summary: Consulta um paciente
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/priority:
    patch:
      tags: [Patients]
      summary: Reclassifica um paciente aguardando
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prioridade]
              properties:
                prioridade:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Paciente reclassificado
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/complete:
    post:
      tags: [Patients]
      summary: Conclui um atendimento ativo
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Atendimento concluído
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/cancel:
    post:
      tags: [Patients]
      summary: Cancela um paciente aguardando ou em atendimento
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Paciente cancelado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /doctors:
    post:
      tags: [Doctors]
      summary: Cadastra um médico
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorInput"
      responses:
        "201":
          description: Médico criado
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /attendances/call-next:
    post:
      tags: [Attendances]
      summary: Chama o próximo paciente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Atendimento iniciado
        "422":
          description: Fila vazia ou médico indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/shift.csv:
    get:
      tags: [System]
      summary: Exporta o relatório do plantão
      responses:
        "200":
          description: Arquivo CSV em UTF-8
          content:
            text/csv:
              schema:
                type: string
  /reset:
    post:
      tags: [System]
      summary: Restaura os dados de demonstração
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Estado restaurado
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia uma sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Sessão iniciada
        "401":
          description: Credenciais inválidas
  /auth/me:
    get:
      tags: [Auth]
      summary: Consulta a sessão atual
      responses:
        "200":
          description: Estado da sessão
  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão
      responses:
        "204":
          description: Sessão encerrada
components:
  parameters:
    Identifier:
      in: path
      name: identifier
      required: true
      schema:
        type: string
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: false
      description: Obrigatório em mutações quando a autenticação está ativa.
      schema:
        type: string
  schemas:
    PatientInput:
      type: object
      required: [nome, prioridade]
      properties:
        id:
          type: string
          pattern: "^(P|PAC-)[A-Z0-9-]*$"
        nome:
          type: string
          minLength: 1
          maxLength: 120
        prioridade:
          type: integer
          minimum: 1
          maximum: 5
    DoctorInput:
      type: object
      required: [nome]
      properties:
        id:
          type: string
          pattern: "^(M|MED-)[A-Z0-9-]*$"
        nome:
          type: string
          minLength: 1
          maxLength: 120
        crm:
          type: string
          maxLength: 40
    Success:
      type: object
      required: [data]
      properties:
        data: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito com o estado atual
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
