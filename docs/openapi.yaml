openapi: 3.1.0
info:
  title: SIGAE API
  version: 1.1.0
  description: API do simulador de gerenciamento de atendimentos de emergência com timestamps reais.
servers:
  - url: http://127.0.0.1:5000/api/v1
    description: Ambiente local
tags:
  - name: System
  - name: Patients
  - name: Doctors
  - name: Attendances
  - name: Auth
paths:
  /health:
    get:
      tags: [System]
      summary: Verifica a aplicação e o banco
      responses:
        "200":
          description: Serviço saudável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /state:
    get:
      tags: [System]
      summary: Retorna o estado completo do plantão
      responses:
        "200":
          description: Estado atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /search:
    get:
      tags: [System]
      summary: Pesquisa pacientes e médicos
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/ValidationError"
  /patients:
    get:
      tags: [Patients]
      summary: Lista pacientes com filtros e paginação
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: priority, schema: {type: integer, minimum: 1, maximum: 5}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, default: 20}}
      responses:
        "200":
          description: Página de pacientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    post:
      tags: [Patients]
      summary: Cadastra um paciente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Paciente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /patients/{identifier}:
    get:
      tags: [Patients]
      summary: Consulta um paciente
      parameters:
        - $ref: "#/components/parameters/Identifier"
      responses:
        "200":
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/priority:
    patch:
      tags: [Patients]
      summary: Reclassifica um paciente aguardando
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prioridade]
              properties:
                prioridade:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Paciente reclassificado
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/complete:
    post:
      tags: [Patients]
      summary: Conclui um atendimento ativo
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Atendimento concluído
        "404":
          $ref: "#/components/responses/NotFound"
  /patients/{identifier}/cancel:
    post:
      tags: [Patients]
      summary: Cancela um paciente aguardando ou em atendimento
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Paciente cancelado
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /doctors:
    get:
      tags: [Doctors]
      summary: Lista médicos por texto ou situação
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
      responses:
        "200":
          description: Corpo médico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
    post:
      tags: [Doctors]
      summary: Cadastra um médico
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorInput"
      responses:
        "201":
          description: Médico criado
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /doctors/{identifier}/status:
    patch:
      tags: [Doctors]
      summary: Atualiza a disponibilidade de um médico
      parameters:
        - $ref: "#/components/parameters/Identifier"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [situacao]
              properties:
                situacao:
                  type: string
                  enum: [Disponivel, Indisponivel]
      responses:
        "200": {description: Situação atualizada}
        "404": {$ref: "#/components/responses/NotFound"}
  /attendances/call-next:
    post:
      tags: [Attendances]
      summary: Chama o próximo paciente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Atendimento iniciado
        "422":
          description: Fila vazia ou médico indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/shift.csv:
    get:
      tags: [System]
      summary: Exporta o relatório do plantão
      responses:
        "200":
          description: Arquivo CSV em UTF-8
          content:
            text/csv:
              schema:
                type: string
  /history:
    get:
      tags: [Attendances]
      summary: Lista o histórico de atendimentos
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, default: 20}}
      responses:
        "200":
          description: Histórico paginado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /structures:
    get:
      tags: [System]
      summary: Inspeciona as estruturas de dados atuais
      responses:
        "200":
          description: Min-Heaps, Hash, AVL e Rubro-Negra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /reports/summary:
    get:
      tags: [System]
      summary: Retorna os indicadores operacionais atuais
      responses:
        "200":
          description: Resumo do plantão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /reset:
    post:
      tags: [System]
      summary: Restaura os dados de demonstração
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Estado restaurado
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia uma sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Sessão iniciada
        "401":
          description: Credenciais inválidas
  /auth/me:
    get:
      tags: [Auth]
      summary: Consulta a sessão atual
      responses:
        "200":
          description: Estado da sessão
  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão
      responses:
        "204":
          description: Sessão encerrada
  /auth/users:
    get:
      tags: [Auth]
      summary: Lista usuários como administrador
      responses:
        "200": {description: Usuários cadastrados}
        "401": {description: Autenticação necessária}
        "403": {description: Papel insuficiente}
    post:
      tags: [Auth]
      summary: Cria um usuário como administrador
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string, minLength: 3}
                password: {type: string, minLength: 8, format: password}
                role:
                  type: string
                  enum: [recepcao, enfermagem, medico, administrador]
      responses:
        "201": {description: Usuário criado}
        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /auth/users/{user_id}/active:
    patch:
      tags: [Auth]
      summary: Ativa ou desativa um usuário
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer}
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        "200": {description: Estado atualizado}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  parameters:
    Identifier:
      in: path
      name: identifier
      required: true
      schema:
        type: string
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: false
      description: Obrigatório em mutações quando a autenticação está ativa.
      schema:
        type: string
  schemas:
    PatientInput:
      type: object
      required: [nome, prioridade]
      properties:
        id:
          type: string
          pattern: "^(P|PAC-)[A-Z0-9-]*$"
        nome:
          type: string
          minLength: 1
          maxLength: 120
        queixa:
          type: string
          maxLength: 500
        prioridade:
          type: integer
          minimum: 1
          maximum: 5
    DoctorInput:
      type: object
      required: [nome]
      properties:
        id:
          type: string
          pattern: "^(M|MED-)[A-Z0-9-]*$"
        nome:
          type: string
          minLength: 1
          maxLength: 120
        crm:
          type: string
          maxLength: 40
        especialidade:
          type: string
          maxLength: 80
    Success:
      type: object
      required: [data]
      properties:
        data: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito com o estado atual
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
