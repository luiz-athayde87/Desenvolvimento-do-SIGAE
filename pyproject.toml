[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sigae"
version = "1.0.0"
description = "Simulador inteligente de gerenciamento de atendimentos de emergência"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
prod = [
  "waitress>=3.0,<4",
]

[project.scripts]
sigae = "sigae.cli:main"

[tool.setuptools]
packages = ["sigae"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sigae", "arvore_avl", "arvore_rubro_negra", "heap_medicos", "heap_pacientes", "tabela_hash"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["instance", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
